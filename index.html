* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.4; -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; border-radius: 6px; }
svg { display: block; flex: none; }
.wrap { width: 100%; max-width: 50rem; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap.wide { max-width: none; }
.muted { color: var(--muted); }


.top { position: sticky; top: 0; z-index: 20; background: var(--bar); -webkit-backdrop-filter: saturate(1.6) blur(14px); backdrop-filter: saturate(1.6) blur(14px); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); }
.top-row { display: flex; align-items: center; gap: 8px; padding-block: 10px 8px; }
.top h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top h1 small { font-size: 14px; color: var(--muted); font-weight: 700; margin-left: 6px; }
.chipb { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 9px; border: 0; background: var(--chip); font-size: 14px; font-weight: 700; color: var(--ink); white-space: nowrap; }
.chipb.on { background: var(--accent); color: var(--accent-ink); }
.chipb svg { width: 16px; height: 16px; }
.segc { display: flex; background: var(--chip); border-radius: 9px; padding: 2px; gap: 2px; margin-bottom: 10px; }
.segc button { flex: 1; border: 0; background: none; padding: 7px 6px; border-radius: 7px; font-size: 14px; font-weight: 700; color: var(--ink2); white-space: nowrap; }
.segc button[aria-pressed="true"] { background: var(--card); box-shadow: 0 1px 3px rgb(0 0 0 / 0.15); color: var(--ink); }
.segc.sm { margin: 0; display: inline-flex; }
.segc.sm button { flex: none; padding: 6px 12px; font-size: 13px; }

.screen { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
.notice { margin-top: 16px; padding: 12px 14px; border-radius: 10px; background: var(--chip); font-size: 14px; display: grid; gap: 8px; justify-items: start; }
.notice small { color: var(--muted); font-size: 12.5px; }
.notice.admin { background: var(--accent-soft); }
.h2 { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 32px 0 12px; }
.h2 h2 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -0.005em; }
.h2 small { color: var(--muted); font-size: 14px; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); white-space: nowrap; vertical-align: 1px; }
.pill.ok { color: var(--ok); } .pill.warn { color: var(--warn); background: var(--warn-soft); } .pill.acc { background: var(--accent); color: var(--accent-ink); }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.linkb { border: 0; background: none; padding: 0; color: var(--accent-text); font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; gap: 4px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 9px; padding: 8px 14px; font-weight: 700; font-size: 15px; background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: var(--chip); color: var(--ink); }
.tool { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--bg2); border-radius: 9px; padding: 6px 10px; font-size: 14px; font-weight: 700; color: var(--ink); }
.tools { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }


.ch { font-weight: 700; white-space: nowrap; }
.ch sup { font-size: 0.68em; line-height: 0; position: relative; top: -0.05em; vertical-align: super; margin-left: 0.02em; }
.kc { position: relative; display: inline-block; min-width: 2.3em; padding: 3px 7px; border-radius: 6px; background: var(--chip); text-align: center; font-size: 15px; font-weight: 700; line-height: 1.25; }
.kc:empty { background: none; }
.kc.chg { background: var(--warn-soft); color: var(--warn); box-shadow: inset 0 0 0 1.5px var(--warn); }

function parseHead(h, sheetName) {

function charFlags(text, runs, style) {

function songFields(rest, s) {

function parseSongs(cell, runs, style) {

function fixDates(events) {

  for (const e of events) {

    const twin = events.filter((x) => x !== e && x.date === e.date && x.session === e.session && !x.dateWarn);
    if (twin.length) { twin[0].dupOn = e.tab; continue; }

FW.ROSTER_TAB = "Состав";

FW.parseBook = function (sheets) {
  let events = [], base = [], learn = [], roster = null, rosterHead = null;
  const tabs = [], layouts = {};
  for (const sh of sheets) {
    const h0 = ((sh.rows[0] || [])[0] || "").trim();

      const w = Math.max(4, ...sh.rows.map((r) => { let n = r.length; while (n && !(r[n - 1] || "").trim()) n--; return n; }));
      rosterHead = Array.from({ length: w }, (_, j) => ((sh.rows[0] || [])[j] || "").trim());
